; Supervisor program (same pattern as ScoreApp). Put in ~/supervisor/conf.d/intellect-api.conf
; ONLY if you move off Passenger to a reverse-proxied uvicorn (see README, option B).
[program:intellect-api]
command=/home/salesne2/virtualenv/intellect-api.salesnet.ng/3.13/bin/uvicorn main:app --host 127.0.0.1 --port 8002 --workers 2 --timeout-keep-alive 5 --no-access-log
directory=/home/salesne2/intellect-api.salesnet.ng
user=salesne2
autostart=true
autorestart=true
startsecs=3
startretries=999999
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/salesne2/intellect-api.salesnet.ng/logs/app.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"
; Never give up - restart on ANY exit
exitcodes=0